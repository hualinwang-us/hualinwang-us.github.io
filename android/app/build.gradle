plugins { id "com.android.application" }

def ksPass = System.getenv("KS_PASS")
def runNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

android {
    namespace "com.hualin.app"
    compileSdk 34
    defaultConfig {
        applicationId "com.hualin.app"
        minSdk 23
        targetSdk 34
        versionCode runNo
        versionName "1.0." + runNo
    }
    signingConfigs {
        release {
            if (ksPass) {
                storeFile file("../hualin-release.jks")
                storePassword ksPass
                keyAlias "hualin"
                keyPassword ksPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ksPass) signingConfig signingConfigs.release
        }
    }
    buildFeatures { buildConfig true }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
