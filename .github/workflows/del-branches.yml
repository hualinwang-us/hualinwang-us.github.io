name: Delete temp branches
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git push origin --delete flyer-check probe-out || true
          git config user.name hualin; git config user.email hualin@users.noreply.github.com
          git rm -q .github/workflows/del-branches.yml && git commit -qm "remove one-off workflow" && git pull -q --rebase && git push origin HEAD:main
