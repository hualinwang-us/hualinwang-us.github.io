name: Flyer probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/flyer-probe.mjs > probe.log 2>&1 || true
      - run: |
          git config user.name "hualin"; git config user.email "hualin@users.noreply.github.com"
          git checkout --orphan probe-out; git rm -rq --cached . ; git add probe.log; git commit -qm probe; git push -f origin probe-out
