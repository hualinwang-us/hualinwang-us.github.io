name: APK privacy audit
on: workflow_dispatch
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: "${{ github.token }}", R: "${{ github.repository }}" }
        run: |
          gh release download -R "$R" --pattern hualin.apk -D apk
          cd apk && unzip -q -o hualin.apk -d x
          echo "::notice title=cert::$(keytool -printcert -jarfile hualin.apk | grep -E 'Owner|Issuer' | tr '\n' ' ')"
          hits=$( (find x -type f -exec strings -n 4 {} \; ; find x -name '*.dex' -exec strings -e l {} \;) | grep -i -E 'hualinwang|huamai|gmail|@qq\.|[0-9]{3}-[0-9]{3}-[0-9]{4}' | sort -u | head -20 | tr '\n' ' ')
          echo "::notice title=hits::${hits:-NONE}"
          echo "::notice title=urls::$(find x -name '*.dex' -exec strings {} \; | grep -o -E 'https?://[a-zA-Z0-9./_-]+' | sort -u | head -20 | tr '\n' ' ')"
