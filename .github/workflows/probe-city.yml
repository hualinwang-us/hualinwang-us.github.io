name: probe-city
on: { push: { branches: [main], paths: [".github/workflows/probe-city.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: |
          F=https://wkiviznpdcjubyqfovfx.supabase.co/functions/v1/transit
          echo "::notice title=subway::$(curl -s -H 'apikey: sb_publishable_IeP_U-Y62FQ02vrENmlmwg_LtZxVL6G' "$F?op=subway&stop=701&routes=7" | head -c 400)"
          echo "::notice title=subway2::$(curl -s -H 'apikey: sb_publishable_IeP_U-Y62FQ02vrENmlmwg_LtZxVL6G' "$F?op=subway&stop=A27&routes=A,C,E" | head -c 300)"
          S=https://data.cityofnewyork.us/resource
          echo "::notice title=geo::$(curl -s 'https://geosearch.planninglabs.nyc/v2/search?size=1&text=41-60%20Main%20St%20Queens' | grep -o '"bbl":"[0-9]*"' | head -1)"
          echo "::notice title=viol::$(curl -s "$S/wvxf-dwi5.json?\$limit=2&\$select=class,violationstatus,novdescription&\$where=bbl='4051210020'" | head -c 300)"
          echo "::notice title=comp::$(curl -s "$S/ygpa-z7cr.json?\$select=count(*)%20as%20n&\$where=borough='QUEENS'%20AND%20block='5121'%20AND%20lot='20'" | head -c 200)"
          echo "::notice title=311::$(curl -s "$S/erm2-nwe9.json?\$select=complaint_type,count(*)%20as%20n&\$group=complaint_type&\$limit=3&\$where=bbl='4051210020'" | head -c 300)"
          echo "::notice title=lot::$(curl -s "$S/vy5i-a666.json?\$limit=1&\$where=lottery_status='Active'" | head -c 900)"
          echo "::notice title=wc::$(curl -s "$S/i7jb-7jku.json?\$limit=1" | head -c 500)"
          echo "::notice title=wifi::$(curl -s "$S/s4kf-3yrf.json?\$limit=1&\$select=street_address,latitude,longitude&\$where=link_installation_status='Live'" | head -c 300)"
          echo "::notice title=lib::$(curl -s "$S/kh3d-xhq7.json?\$limit=1&\$select=name,address,phone,latitude,longitude" | head -c 300)"
          git push origin --delete probe-x 2>/dev/null || true
          git config user.name bot; git config user.email bot@x; git rm -q .github/workflows/probe-city.yml; git commit -qm "remove probe"; git pull -q --rebase; git push -q
