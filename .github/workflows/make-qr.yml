name: Make QR
on: workflow_dispatch
permissions:
  contents: write
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q "qrcode[pil]"
          python -c "import qrcode;q=qrcode.QRCode(error_correction=qrcode.constants.ERROR_CORRECT_M,box_size=16,border=2);q.add_data('https://huamai88.com/?source=moments');q.make_image(fill_color='#1B1F2A',back_color='white').save('/tmp/qr.png')"
          git config user.name hualin; git config user.email hualin@users.noreply.github.com
          git checkout --orphan probe-out; git rm -rqf --cached .; cp /tmp/qr.png .; git add qr.png; git commit -qm q; git push -f origin probe-out
