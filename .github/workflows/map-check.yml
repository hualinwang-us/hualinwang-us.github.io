name: Map check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: |
          (python3 -m http.server 8765 >/dev/null 2>&1 &) ; sleep 2
          cat > t.js <<'JS'
          const {chromium,devices}=require('playwright');(async()=>{const b=await chromium.launch();const c=await b.newContext({...devices['iPhone 13'],geolocation:{latitude:40.7592,longitude:-73.8306},permissions:['geolocation']});
          let k=0;await c.route('**/functions/v1/transit**',r=>{const u=new URL(r.request().url());const op=u.searchParams.get('op');k++;const t=Date.now();
           const body=op==='stops'?{stops:[{id:'MTA_501367',name:'MAIN ST/ROOSEVELT AV',dir:'N',lat:40.759909,lon:-73.830233,routes:['Q44','Q20']}]}:
           {list:[{route:'Q44',dest:'BRONX ZOO',eta:new Date(t+240000).toISOString(),away:'0.6 miles away',stops:3,vid:'8123',lat:40.7520+k*0.0015,lon:-73.8285,bearing:90},{route:'Q20',dest:'COLLEGE PT',eta:new Date(t+540000).toISOString(),away:'1.4 miles away',stops:6,vid:'7311',lat:40.7440+k*0.001,lon:-73.8255,bearing:95}],stop:{lat:40.759909,lon:-73.830233,name:'MAIN ST/ROOSEVELT AV'}};
           r.fulfill({status:200,contentType:'application/json',headers:{'access-control-allow-origin':'*'},body:JSON.stringify(body)})});
          const p=await c.newPage();const e=[];p.on('pageerror',x=>e.push(x.message));p.on('console',m=>{if(m.type()==='error')e.push(m.text().slice(0,150))});
          await p.goto('http://localhost:8765/?nosplash#t-transit');await p.waitForTimeout(2500);await p.click('[data-trlocate]');await p.waitForTimeout(2000);await p.click('[data-trstop="0"]');await p.waitForTimeout(6000);
          const info=await p.evaluate(()=>{const m=document.querySelector('#trMap');return m?('h='+m.offsetHeight+' cls='+m.className+' kids='+m.children.length+' L='+!!window.L):'nomap'});console.log('::notice title=info::'+info);await p.evaluate(()=>{const m=document.querySelector('#trMap');if(m)m.scrollIntoView()});await p.waitForTimeout(500);await p.screenshot({path:'m1.png'});await p.click('[data-trrefresh]');await p.waitForTimeout(4000);await p.screenshot({path:'m2.png'});console.log('::notice title=errs::'+JSON.stringify(e));await b.close()})();
          JS
          node t.js
      - run: |
          git config user.name hualin; git config user.email hualin@users.noreply.github.com
          mkdir /tmp/o; cp m1.png m2.png /tmp/o/; git checkout --orphan probe-out; git rm -rqf --cached .; cp /tmp/o/* .; git add m1.png m2.png; git commit -qm m; git push -f origin probe-out
