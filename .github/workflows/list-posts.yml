name: List posts
on: workflow_dispatch
jobs:
  l:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node -e 'global.window={};require("./config.js");const c=window.HL_CONFIG;const u=c.supabaseUrl.replace(/\/rest\/v1\/?$/,"").replace(/\/$/,"");
          fetch(u+"/rest/v1/posts?select=id,board,title,created_at&order=created_at.desc&limit=40",{headers:{apikey:c.supabaseKey}}).then(r=>r.json()).then(d=>{for(const p of d)console.log(`::notice title=${p.board} #${p.id}::${p.title} | ${p.created_at}`)})'
