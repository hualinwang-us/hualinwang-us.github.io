name: Live check
on: workflow_dispatch
jobs:
  l:
    runs-on: ubuntu-latest
    steps:
      - run: npm i playwright@1 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
      - run: |
          cat > t.js <<'JS'
          const {chromium,devices}=require('playwright');(async()=>{const b=await chromium.launch();
          for(const [n,o] of [['iphone',{...devices['iPhone 13']}],['android-app',{...devices['Pixel 7'],userAgent:devices['Pixel 7'].userAgent+' HuaLinApp/1.0'}]]){
          const p=await (await b.newContext({...o,colorScheme:'dark'})).newPage();const errs=[];p.on('pageerror',e=>errs.push(e.message));p.on('console',m=>{if(m.type()==='error')errs.push(m.text().slice(0,120))});
          await p.goto('https://huamai88.com/?nosplash&nohit#deals');await p.waitForTimeout(6000);
          const s=await p.$$eval('#dealsFull section',s=>s.map(x=>(x.querySelector('h2')||{}).textContent+':'+x.querySelectorAll('li').length).join(' | '));
          console.log(`::notice title=${n}::${s} || errs=${errs.slice(0,4).join(' ; ')}`);}
          const d=await (await fetch('https://huamai88.com/data/deals.json?x='+Date.now())).text();console.log('::notice title=deals.json::len='+d.length+' head='+d.slice(0,300).replace(/\n/g,' '));
          await b.close()})();
          JS
          node t.js
