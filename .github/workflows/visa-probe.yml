name: Visa probe
on: workflow_dispatch
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://travel.state.gov/content/travel/en/legal/visa-law0/visa-bulletin.html
          echo "::notice title=plain::$(curl -s -o /dev/null -w '%{http_code}' $U)"
          echo "::notice title=browser::$(curl -s -o /dev/null -w '%{http_code}' -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36' -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' -H 'Accept-Language: en-US,en;q=0.9' -H 'Upgrade-Insecure-Requests: 1' -H 'Sec-Fetch-Dest: document' -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Site: none' --compressed $U)"
          echo "::notice title=jina::$(curl -s -o /tmp/j.txt -w '%{http_code}' https://r.jina.ai/$U; grep -o 'visa-bulletin-for-[a-z]*-[0-9]*' /tmp/j.txt | head -3 | tr '\n' ' ')"
          npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          node -e "const {chromium}=require('playwright');(async()=>{const b=await chromium.launch();const p=await b.newPage();const r=await p.goto('$U');const h=await p.content();console.log('::notice title=playwright::'+r.status()+' '+(h.match(/visa-bulletin-for-[a-z]+-\d{4}/g)||[]).slice(0,3).join(' '));await b.close()})()"
