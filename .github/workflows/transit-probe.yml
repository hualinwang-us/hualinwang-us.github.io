name: Transit probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call transit function
        run: |
          URL=$(node -e 'global.window={};require("./config.js");const c=window.HL_CONFIG;console.log(c.supabaseUrl.replace(/\/rest\/v1\/?$/,"").replace(/\/$/,""))')
          KEY=$(node -e 'global.window={};require("./config.js");const c=window.HL_CONFIG;console.log(c.supabaseKey)')
          for q in "op=rail&sys=lirr&stop=56" "op=rail&sys=mnr&stop=1" "op=stops&lat=40.7590&lon=-73.8300" "op=bus&stop=501627"; do
            OUT=$(curl -s -m 30 -H "apikey: $KEY" "$URL/functions/v1/transit?$q" | head -c 600 | tr '\n' ' ')
            echo "::notice title=$q::$OUT"
          done
      - name: LIRR stop ids in feed
        run: |
          npm i --no-save gtfs-realtime-bindings@1.1.1 >/dev/null 2>&1
          node -e '
          const G=require("gtfs-realtime-bindings");
          (async()=>{const r=await fetch("https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/lirr%2Fgtfs-lirr");
          const f=G.transit_realtime.FeedMessage.decode(new Uint8Array(await r.arrayBuffer()));
          const tus=f.entity.filter(e=>e.tripUpdate);const ids=new Map();
          for(const e of tus)for(const s of e.tripUpdate.stopTimeUpdate||[])ids.set(s.stopId,(ids.get(s.stopId)||0)+1);
          const now=Date.now()/1000;const t56=[];for(const e of tus)for(const s of e.tripUpdate.stopTimeUpdate||[])if(s.stopId==="56")t56.push(Math.round(((Number(s.departure?.time||s.arrival?.time))-now)/60)+"m/"+e.tripUpdate.trip.startDate);console.log("::notice title=lirr56::hdr="+f.header.timestamp+" now="+Math.round(now)+" "+t56.join(","));const ex=tus[0]?JSON.stringify(tus[0].tripUpdate.stopTimeUpdate.slice(0,3)):"none";
          console.log("::notice title=lirr::trips="+tus.length+" ids="+[...ids].slice(0,40).map(x=>x.join(":")).join(",")+" ex="+ex.slice(0,500));})()'
