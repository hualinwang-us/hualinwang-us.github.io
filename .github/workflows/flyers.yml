name: Supermarket flyers
on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * 5"   # Friday ~10am New York
    - cron: "17 22 * * 5"   # Friday ~6pm New York (stores that post late)
    - cron: "17 14 * * 6"   # Saturday morning, catch-up
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/flyers.mjs
      - name: Save
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data/flyers.json data/flyer-img 2>/dev/null || git add data/flyers.json
          git diff --cached --quiet || (git commit -m "Update supermarket flyers" && git pull --rebase && git push)
