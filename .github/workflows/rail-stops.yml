name: Rail stations
on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save gtfs-realtime-bindings
      - run: node scripts/rail-stops.mjs
      - name: Save
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data/rail-stops.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update rail stations" && git pull --rebase && git push)
