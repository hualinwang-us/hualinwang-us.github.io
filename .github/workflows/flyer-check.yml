name: Flyer check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow requests -q
      - shell: python
        run: |
          import json, io, requests, os
          from PIL import Image
          os.makedirs("/tmp/t", exist_ok=True); d = json.load(open("data/flyers.json")); i = 0
          for s in d["stores"]:
              for u in s["imgs"]:
                  i += 1
                  try:
                      r = requests.get(u, headers={"User-Agent": "Mozilla/5.0", "Referer": "https://huamai88.com/"}, timeout=60)
                      im = Image.open(io.BytesIO(r.content)).convert("RGB"); print(s["id"], r.status_code, im.size)
                      im.thumbnail((420, 1400)); im.save(f"/tmp/t/{i:02d}-{s['id']}.jpg", quality=70)
                  except Exception as e: print(s["id"], "FAIL", e)
      - run: |
          git config user.name a; git config user.email a@a
          git checkout --orphan flyer-check; git rm -rqf --cached .; cp /tmp/t/* .; git add *.jpg; git commit -qm c; git push -f origin flyer-check
