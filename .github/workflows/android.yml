name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$KS_PASS" ]; then TASK=assembleRelease; OUT=release/app-release.apk; echo "KIND=release" >> $GITHUB_ENV
          else echo "No signing password yet: building a test version"; TASK=assembleDebug; OUT=debug/app-debug.apk; echo "KIND=test" >> $GITHUB_ENV; fi
          if ! gradle -p android :app:$TASK --no-daemon 2>&1 | tee build.log; then
            grep -E "error|What went wrong|wrong|Exception|failed" -A4 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cp android/app/build/outputs/apk/$OUT hualin.apk
          ls -la hualin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hualin-apk
          path: hualin.apk
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: 华邻网 Android ${{ env.KIND == 'release' && '正式版' || '测试版' }} 1.0.${{ github.run_number }}
          body: 下载 hualin.apk，在安卓手机上打开安装。第一次安装时手机会提示“允许安装未知来源的应用”，选允许即可。
          files: hualin.apk
          make_latest: true
