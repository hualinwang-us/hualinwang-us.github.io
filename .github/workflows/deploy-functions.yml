name: Deploy Supabase functions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Deploy transit
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning title=deploy::SUPABASE_ACCESS_TOKEN not set"; exit 0; fi
          supabase functions deploy transit --project-ref wkiviznpdcjubyqfovfx --no-verify-jwt
          echo "::notice title=deploy::transit deployed"
