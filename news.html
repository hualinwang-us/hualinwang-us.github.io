<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}} - 华邻网</title>
<meta name="description" content="{{DESC}}">
<meta name="theme-color" content="#121a2b">
<meta property="og:type" content="article">
<meta property="og:site_name" content="华邻网">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:image" content="{{BASE}}assets/share.png">
<meta property="og:url" content="{{URL}}">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="{{URL}}">
<link rel="icon" href="{{BASE}}assets/share.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap">
<link rel="stylesheet" href="{{BASE}}assets/style.css">
</head>
<body>
<img class="wx-thumb" src="{{BASE}}assets/share.png" alt="" width="300" height="300">
<div class="util"><div class="shell util-in">
  <span class="util-mid"></span>
  <div class="seg" role="group" aria-label="Language / 语言">
    <button type="button" id="lzh" aria-pressed="true">中文</button>
    <button type="button" id="len" aria-pressed="false">EN</button>
  </div>
</div></div>
<header class="mast"><div class="shell mast-in">
  <a class="logo" href="{{BASE}}">
    <span class="seal" aria-hidden="true">邻</span>
    <span class="logo-txt"><b>华邻网</b><small>在美华人 · 新闻与生活信息</small></span>
  </a>
  <a class="btn" href="{{BASE}}#post" data-zh="免费发布" data-en="Post Free">免费发布</a>
</div></header>
<main class="shell view">
  <div class="art-wrap"><article class="art">{{BODY}}
    <div class="post-actions"><a class="btn" href="{{SRCURL}}" target="_blank" rel="noopener">{{READ}}</a><button type="button" class="btn ghost" id="shareBtn" data-zh="分享到微信" data-en="Share">分享到微信</button></div>
    <p class="g-fine">{{COPY}}</p></article>
    <aside class="art-side"><a class="g-check-cta" href="{{BASE}}#check"><b data-zh="我能申请什么？" data-en="What can I apply for?">我能申请什么？</b><span data-zh="回答 6 个问题，看看你家可能符合哪些福利 →" data-en="Answer 6 questions to see what your family may qualify for →">回答 6 个问题，看看你家可能符合哪些福利 →</span></a>
    <a class="btn ghost" href="{{BASE}}" data-zh="回到华邻网首页看更多新闻" data-en="More news on HuaLin">回到华邻网首页看更多新闻</a></aside></div>
</main>
<footer class="foot"><div class="shell foot-in">
  <div><b>华邻网 HuaLin</b><p data-zh="在美华人新闻、生活指南与免费分类信息。" data-en="News, life guides and free listings for Chinese Americans.">在美华人新闻、生活指南与免费分类信息。</p></div>
  <div><b data-zh="免责声明" data-en="Disclaimer">免责声明</b><p data-zh="本站内容仅供参考，不构成法律或专业意见，与政府机构无关。" data-en="General information only, not legal or professional advice. Not affiliated with any government agency.">本站内容仅供参考，不构成法律或专业意见，与政府机构无关。</p><p><a class="flink" href="{{BASE}}#disclaimer" data-zh="阅读完整免责声明 →" data-en="Read the full disclaimer →">阅读完整免责声明 →</a></p></div>
</div></footer>
<div class="toast" id="toast" role="status" hidden></div>
<script src="{{BASE}}assets/share.js"></script>
<script>
(function () {
  var lang = "zh"; try { lang = localStorage.getItem("hl-lang") || "zh"; } catch (e) {}
  function apply() {
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.querySelectorAll("[data-lang]").forEach(function (el) { el.hidden = el.getAttribute("data-lang") !== lang; });
    document.querySelectorAll("[data-zh]").forEach(function (el) { el.textContent = el.getAttribute("data-" + lang); });
    document.getElementById("lzh").setAttribute("aria-pressed", String(lang === "zh"));
    document.getElementById("len").setAttribute("aria-pressed", String(lang === "en"));
  }
  function set(l) { lang = l; try { localStorage.setItem("hl-lang", l); } catch (e) {} apply(); }
  document.getElementById("lzh").onclick = function () { set("zh"); };
  document.getElementById("len").onclick = function () { set("en"); };
  document.getElementById("shareBtn").onclick = function () {
    if (window.HLShare) window.HLShare.open({ url: "{{URL}}", title: document.title, text: document.title });
  };
  apply();
})();
</script>
</body>
</html>
