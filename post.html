<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}} - 华邻网</title>
<meta name="description" content="{{DESC}}">
<meta name="theme-color" content="#121a2b">
<meta name="referrer" content="no-referrer">
<meta property="og:type" content="article">
<meta property="og:site_name" content="华邻网">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:image" content="{{BASE}}assets/share.png">
<meta property="og:url" content="{{URL}}">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="{{URL}}">
<link rel="icon" href="{{BASE}}assets/share.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap">
<link rel="stylesheet" href="{{BASE}}assets/style.css">
</head>
<body>
<img class="wx-thumb" src="{{BASE}}assets/share.png" alt="" width="300" height="300">
<div class="util"><div class="shell util-in">
  <span id="today"></span>
  <span class="util-mid"></span>
  <div class="seg" role="group" aria-label="Language / 语言">
    <button type="button" id="lzh" aria-pressed="true">中文</button>
    <button type="button" id="len" aria-pressed="false">EN</button>
  </div>
</div></div>
<header class="mast"><div class="shell mast-in">
  <a class="logo" href="{{BASE}}">
    <span class="seal" aria-hidden="true">邻</span>
    <span class="logo-txt"><b>华邻网</b><small id="tagline">在美华人 · 新闻与生活信息</small></span>
  </a>
  <a class="btn" href="{{BASE}}#post" id="postLink">免费发布</a>
</div></header>
<main class="shell view">
  <div id="post">{{SSR}}</div>
</main>
<footer class="foot"><div class="shell foot-in">
  <div><b>华邻网 HuaLin</b><p id="foot1">在美华人新闻与免费分类信息。</p></div>
  <div><b id="footSafeH">安全提示</b><p id="footSafe">分类信息由用户自行发布，请自行核实；交易当面确认，切勿预付定金，谨防诈骗。</p></div>
  <div><b id="footLegal">免责声明</b><p id="footLegalP">本信息由用户发布，本站未核实其内容，也不参与交易。</p><p><a class="flink" id="footLegalLink" href="{{BASE}}#disclaimer">阅读完整免责声明 →</a></p></div>
</div></footer>
<div class="toast" id="toast" role="status" hidden></div>
<script>window.HL_POST = {{JSON}};</script>
<script src="{{BASE}}config.js"></script>
<script src="{{BASE}}assets/common.js"></script>
<script src="{{BASE}}assets/share.js"></script>
<script src="{{BASE}}assets/post.js"></script>
</body>
</html>
